[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-system"
version = "0.1.0"
description = "Offline-first, AST-grounded code review engine and CLI"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1", "rich>=13.9,<15", "httpx>=0.28,<1",
  "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
aicr = "ai_code_review.cli.app:app"
aicr-api = "ai_code_review.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
